name: startup-hunter

on:
  schedule:
    - cron: "7 * * * *"     # every hour: inbox -> radar (every 6h) -> contacts -> outreach
    - cron: "17 3 * * *"    # 08:47 IST  LinkedIn draft to Discord
    - cron: "53 3 * * *"    # 09:23 IST  X post
    - cron: "11 13 * * *"   # 18:41 IST  X post
  workflow_dispatch:
    inputs:
      command:
        description: "Run one command by hand"
        required: true
        default: status
        type: choice
        options: [status, hourly, radar, contacts, outreach, inbox, yap, linkedin, go-live]

permissions:
  contents: write

concurrency:
  group: startup-hunter      # never two runs touching hunter.db at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.3-70b-versatile' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
      TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick command
        id: cmd
        run: |
          case "${{ github.event.schedule }}" in
            "17 3 * * *")  echo "c=linkedin" >> "$GITHUB_OUTPUT" ;;
            "53 3 * * *"|"11 13 * * *") echo "c=yap" >> "$GITHUB_OUTPUT" ;;
            "7 * * * *")   echo "c=hourly" >> "$GITHUB_OUTPUT" ;;
            *)             echo "c=${{ inputs.command || 'status' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run
        run: python run.py ${{ steps.cmd.outputs.c }}

      - name: Save state (who was emailed, replies, posts)
        if: always()
        run: |
          git config user.name "startup-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f hunter.db outbox 2>/dev/null || true
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "state: ${{ steps.cmd.outputs.c }} $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done
