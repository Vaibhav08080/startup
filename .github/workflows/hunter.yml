name: startup-hunter

on:
  schedule:
    - cron: "7 * * * *"     # every hour: inbox -> radar (every 6h) -> contacts -> outreach
  push:
    branches: [main]
    paths: [kick.txt]        # push a command into kick.txt to run it (used for remote testing)
  workflow_dispatch:
    inputs:
      command:
        description: "Run one command by hand"
        required: true
        default: status
        type: choice
        options: [llmtest, status, hourly, radar, contacts, outreach, inbox, go-live]

permissions:
  contents: write

concurrency:
  group: startup-hunter      # never two runs touching hunter.db at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.groq.com/openai/v1' }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'llama-3.3-70b-versatile' }}
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the state commit can rebase onto newer code pushes

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "c=$(head -1 kick.txt | tr -cd 'a-z-')" >> "$GITHUB_OUTPUT"; exit 0
          fi
          case "${{ github.event.schedule }}" in
            "7 * * * *")   echo "c=hourly" >> "$GITHUB_OUTPUT" ;;
            *)             echo "c=${{ inputs.command || 'status' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run
        run: |
          set -o pipefail
          mkdir -p logs
          python -u run.py ${{ steps.cmd.outputs.c }} 2>&1 | tee "logs/last-${{ steps.cmd.outputs.c }}.log"

      - name: Save state (who was emailed, replies, bounces)
        if: always()
        run: |
          git config user.name "startup-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f hunter.db ] && git add -f hunter.db
          [ -d outbox ] && git add -f outbox
          [ -d logs ] && git add -f logs
          true
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "state: ${{ steps.cmd.outputs.c }} $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state saved"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::could not save hunter.db to the repo"
          exit 1
