# ============ OUTREACH ============
outreach:
  daily_send_cap: 15          # max per day once warmed up
  warmup: [[7, 5], [14, 10]]  # first 7 days: 5/day, days 8-14: 10/day, then daily_send_cap
  verify_below_confidence: 80 # Hunter-verify any email less sure than this before sending
  exclude_domains: [policybazaar.com, pbfintech.in, algomighty.com, techiegreek.com]
  per_run_cap: 4              # cron runs hourly -> spreads sends through the day
  send_window_ist: [10, 19]   # only send between 10:00 and 19:00 IST, Mon-Sat
  min_gap_seconds: [90, 300]  # random pause between two sends
  followups_after_days: [4, 9]   # 2 follow-ups max, then stop
  max_contacts_per_company: 2    # founder + CTO/eng lead
